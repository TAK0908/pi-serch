<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>π Search — 光速を探せ</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="π Search">
<meta name="theme-color" content="#050810">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@300;700&display=swap');

  :root {
    --bg: #050810;
    --panel: #0a0f1e;
    --accent: #00ffe0;
    --accent2: #ff6b35;
    --text: #c8d8e8;
    --dim: #3a4a5a;
    --found: #00ff88;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,224,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,224,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  .pi-symbol {
    font-size: 72px;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(0,255,224,0.5), 0 0 80px rgba(0,255,224,0.2);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 40px rgba(0,255,224,0.5), 0 0 80px rgba(0,255,224,0.2); }
    50% { text-shadow: 0 0 60px rgba(0,255,224,0.8), 0 0 120px rgba(0,255,224,0.4); }
  }

  h1 {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
    font-size: 14px;
    letter-spacing: 0.3em;
    color: var(--dim);
    margin-top: 8px;
    text-transform: uppercase;
  }

  .target-display {
    background: var(--panel);
    border: 1px solid var(--dim);
    border-left: 3px solid var(--accent2);
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .target-label {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .target-value {
    font-size: 28px;
    color: var(--accent2);
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px rgba(255,107,53,0.4);
  }

  .target-desc {
    font-size: 11px;
    color: var(--dim);
    text-align: right;
    line-height: 1.6;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  .control-group {
    background: var(--panel);
    border: 1px solid var(--dim);
    padding: 12px 16px;
  }

  .control-group label {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }

  .control-group input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
    width: 100%;
    outline: none;
    padding: 2px 0;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 14px;
    border: 1px solid;
    background: transparent;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.15em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }

  #startBtn {
    border-color: var(--accent);
    color: var(--accent);
  }
  #startBtn:hover:not(:disabled) {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 30px rgba(0,255,224,0.3);
  }
  #startBtn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #stopBtn {
    border-color: var(--accent2);
    color: var(--accent2);
  }
  #stopBtn:hover:not(:disabled) {
    background: var(--accent2);
    color: var(--bg);
  }
  #stopBtn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .status-panel {
    background: var(--panel);
    border: 1px solid var(--dim);
    padding: 20px;
    margin-bottom: 20px;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 12px;
  }

  .status-key {
    color: var(--dim);
    letter-spacing: 0.1em;
  }

  .status-val {
    color: var(--accent);
    font-size: 14px;
  }

  .progress-bar-wrap {
    height: 4px;
    background: var(--dim);
    margin-top: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.3s;
    box-shadow: 0 0 10px rgba(0,255,224,0.5);
  }

  /* Scanning animation */
  .scanning-row {
    font-size: 11px;
    color: var(--dim);
    margin-top: 12px;
    height: 18px;
    overflow: hidden;
    letter-spacing: 0.05em;
  }

  .scan-digits {
    color: var(--dim);
  }
  .scan-digits .hl {
    color: var(--accent2);
  }

  /* Result panel */
  .result-panel {
    display: none;
    background: rgba(0,255,136,0.05);
    border: 2px solid var(--found);
    padding: 24px;
    margin-bottom: 20px;
    text-align: center;
    animation: foundAnim 0.5s ease;
  }

  @keyframes foundAnim {
    0% { transform: scale(0.95); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .result-panel.visible { display: block; }

  .found-label {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--found);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .found-position {
    font-size: 48px;
    color: var(--found);
    text-shadow: 0 0 40px rgba(0,255,136,0.6);
    margin-bottom: 8px;
  }

  .found-context {
    font-size: 14px;
    color: var(--text);
    margin-top: 12px;
    letter-spacing: 0.1em;
  }

  .found-context .match {
    color: var(--found);
    text-decoration: underline;
    text-decoration-color: rgba(0,255,136,0.4);
  }

  .found-desc {
    margin-top: 12px;
    font-size: 11px;
    color: var(--dim);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    line-height: 1.8;
  }

  /* Not found panel */
  .notfound-panel {
    display: none;
    background: rgba(255,107,53,0.05);
    border: 1px solid var(--accent2);
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
  }
  .notfound-panel.visible { display: block; }

  .log {
    background: var(--panel);
    border: 1px solid var(--dim);
    padding: 12px 16px;
    height: 120px;
    overflow-y: auto;
    font-size: 11px;
    color: var(--dim);
    line-height: 1.8;
  }

  .log-entry { color: var(--dim); }
  .log-entry.info { color: var(--accent); }
  .log-entry.warn { color: var(--accent2); }
  .log-entry.success { color: var(--found); }

  .speed-info {
    font-size: 10px;
    color: var(--dim);
    text-align: center;
    margin-top: 8px;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="pi-symbol">π</div>
    <h1>光速を円周率の中に探す</h1>
  </header>

  <div class="target-display">
    <div>
      <div class="target-label">Search Target</div>
      <div class="target-value">299792458</div>
    </div>
    <div class="target-desc">
      光速 (m/s)<br>
      Speed of Light<br>
      9 digits
    </div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Start Position</label>
      <input type="number" id="startPos" value="200000000" min="0" step="1000000">
    </div>
    <div class="control-group">
      <label>Search Limit (digits)</label>
      <input type="number" id="searchLimit" value="2000000000" min="1000000" step="100000000">
    </div>
  </div>

  <div class="btn-row">
    <button id="startBtn" onclick="startSearch()">▶ START SEARCH</button>
    <button id="stopBtn" onclick="stopSearch()" disabled>■ STOP</button>
    <button id="resetBtn" onclick="resetProgress()" style="flex:0.5;border-color:var(--dim);color:var(--dim);font-size:11px">↺ RESET</button>
  </div>

  <div class="status-panel">
    <div class="status-row">
      <span class="status-key">POSITION</span>
      <span class="status-val" id="posDisplay">—</span>
    </div>
    <div class="status-row">
      <span class="status-key">SEARCHED</span>
      <span class="status-val" id="searchedDisplay">0 digits</span>
    </div>
    <div class="status-row">
      <span class="status-key">SPEED</span>
      <span class="status-val" id="speedDisplay">—</span>
    </div>
    <div class="status-row">
      <span class="status-key">ETA</span>
      <span class="status-val" id="etaDisplay">—</span>
    </div>
    <div class="status-row">
      <span class="status-key">WAKE LOCK</span>
      <span class="status-val" id="wakeLockStatus">🔓 OFF</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="scanning-row" id="scanningRow">待機中...</div>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="found-label">★ FOUND ★</div>
    <div class="found-position" id="foundPos">—</div>
    <div style="font-size:12px;color:var(--dim)">小数点以下の桁数</div>
    <div class="found-context" id="foundContext">—</div>
    <div class="found-desc" id="foundDesc">—</div>
  </div>

  <div class="notfound-panel" id="notfoundPanel">
    <div style="color:var(--accent2);font-size:13px;letter-spacing:0.2em">NOT FOUND IN RANGE</div>
    <div style="font-size:11px;color:var(--dim);margin-top:8px" id="notfoundDesc">—</div>
  </div>

  <div class="log" id="log"></div>
  <div class="speed-info">api.pi.delivery — Google Cloud 100兆桁πデータ使用</div>
</div>

<script>
const TARGET = "299792458";
const CHUNK = 1000;
const CONCURRENCY = 6;
const SAVE_KEY = 'pi_search_progress';
let wakeLock = null;

async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        log('Wake Lock解除 — 画面スリープ可能になりました', 'warn');
        document.getElementById('wakeLockStatus').textContent = '🔓 OFF';
      });
      log('Wake Lock取得 — 画面スリープを防止中', 'info');
      document.getElementById('wakeLockStatus').textContent = '🔒 ON';
    } catch(e) {
      log('Wake Lock取得失敗: ' + e.message, 'warn');
    }
  } else {
    log('Wake Lock非対応ブラウザ', 'warn');
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    await wakeLock.release();
    wakeLock = null;
    document.getElementById('wakeLockStatus').textContent = '🔓 OFF';
  }
}

// 画面表示に戻った時にWake Lockを再取得
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && running) {
    await requestWakeLock();
  }
});
let running = false;
let totalSearched = 0;
let startTime = null;
let currentPos = 0;
let searchLimit = 2000000000;

function saveProgress(pos) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ pos, savedAt: Date.now() })); } catch(e) {}
}
function loadProgress() {
  try { const d = localStorage.getItem(SAVE_KEY); return d ? JSON.parse(d) : null; } catch(e) { return null; }
}
function clearProgress() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}
window.addEventListener('DOMContentLoaded', () => {
  const saved = loadProgress();
  if (saved) {
    document.getElementById('startPos').value = saved.pos;
    const date = new Date(saved.savedAt).toLocaleString('ja-JP');
    log('前回の進捗: ' + fmt(saved.pos) + '桁目 (' + date + ') — 再開します', 'info');
  }
});

function log(msg, type = '') {
  const el = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + type;
  const ts = new Date().toLocaleTimeString('ja-JP');
  entry.textContent = `[${ts}] ${msg}`;
  el.appendChild(entry);
  el.scrollTop = el.scrollHeight;
}

function fmt(n) {
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(0) + 'K';
  return n.toString();
}

async function fetchChunk(start) {
  const url = `https://api.pi.delivery/v1/pi?start=${start}&numberOfDigits=${CHUNK}&radix=10`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  return data.content;
}

async function startSearch() {
  if (running) return;

  currentPos = parseInt(document.getElementById('startPos').value) || 200000000;
  searchLimit = parseInt(document.getElementById('searchLimit').value) || 2000000000;

  running = true;
  totalSearched = 0;
  startTime = Date.now();

  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('resultPanel').classList.remove('visible');
  document.getElementById('notfoundPanel').classList.remove('visible');

  await requestWakeLock();
  log(`検索開始: position ${fmt(currentPos)} から ${fmt(searchLimit)} 桁先まで`, 'info');
  log(`並列リクエスト数: ${CONCURRENCY}`, 'info');

  const endPos = currentPos + searchLimit;
  let overlap = ''; // carry-over for boundary matches

  while (running && currentPos < endPos) {
    // Launch CONCURRENCY requests in parallel
    const batch = [];
    const batchStart = currentPos;
    for (let i = 0; i < CONCURRENCY && currentPos < endPos; i++) {
      batch.push({ start: currentPos, idx: i });
      currentPos += CHUNK;
    }

    let results;
    try {
      results = await Promise.all(
        batch.map(b => fetchChunk(b.start).then(d => ({ start: b.start, digits: d })))
      );
      await new Promise(r => setTimeout(r, 800));
    } catch(e) {
      if (e.message.includes('429') || e.message.includes('Too Many')) {
        log(`レート制限 (429) — 30秒待機してリトライ`, 'warn');
        await new Promise(r => setTimeout(r, 30000));
      } else {
        log(`APIエラー: ${e.message} — 5秒後リトライ`, 'warn');
        await new Promise(r => setTimeout(r, 5000));
      }
      currentPos = batchStart;
      continue;
    }

    // Sort by start position
    results.sort((a, b) => a.start - b.start);

    // Concatenate with overlap handling
    let combined = overlap;
    const combinedStartPos = results[0].start - overlap.length;

    for (const r of results) {
      combined += r.digits;
      totalSearched += r.digits.length;
    }

    // Search in combined
    const idx = combined.indexOf(TARGET);
    if (idx !== -1) {
      const absolutePos = combinedStartPos + idx;
      found(absolutePos, combined, idx);
      return;
    }

    // Keep overlap for next batch (TARGET.length - 1 chars)
    overlap = combined.slice(-(TARGET.length - 1));

    // Update UI
    const elapsed = (Date.now() - startTime) / 1000;
    const speed = totalSearched / elapsed;
    const remaining = endPos - currentPos;
    const eta = remaining / speed;

    document.getElementById('posDisplay').textContent = fmt(currentPos);
    document.getElementById('searchedDisplay').textContent = fmt(totalSearched) + ' digits';
    document.getElementById('speedDisplay').textContent = fmt(Math.round(speed)) + '/sec';
    document.getElementById('etaDisplay').textContent = eta > 3600
      ? (eta/3600).toFixed(1) + 'h'
      : eta > 60
        ? (eta/60).toFixed(0) + 'm'
        : Math.round(eta) + 's';

    const pct = Math.min(100, ((currentPos - batchStart) / searchLimit * 100 + (totalSearched / searchLimit * 100)) / 2);
    document.getElementById('progressBar').style.width = Math.min(100, totalSearched / searchLimit * 100) + '%';

    // Show scanning preview
    const preview = results[0].digits.slice(0, 40);
    document.getElementById('scanningRow').innerHTML =
      `<span class="scan-digits">${preview.slice(0,16)}<span class="hl">${preview.slice(16,25)}</span>${preview.slice(25)}</span>`;

    saveProgress(currentPos);
    if (totalSearched % (CHUNK * CONCURRENCY * 50) < CHUNK * CONCURRENCY) {
      log(`${fmt(currentPos)}桁目通過... (速度: ${fmt(Math.round(speed))}/sec)`, '');
    }

    // Small yield to keep UI responsive
    await new Promise(r => setTimeout(r, 0));
  }

  if (running) {
    // Not found
    running = false;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    log(`検索完了: ${fmt(totalSearched)}桁を${elapsed}秒で検索 — 見つからず`, 'warn');
    document.getElementById('notfoundPanel').classList.add('visible');
    document.getElementById('notfoundDesc').textContent =
      `${fmt(totalSearched)}桁検索済み（${elapsed}秒） — この範囲には存在しない`;
  }
}

function found(absolutePos, combined, localIdx) {
  running = false;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;

  const context = combined.slice(Math.max(0, localIdx - 6), localIdx + TARGET.length + 6);
  const before = context.slice(0, Math.min(6, localIdx));
  const match = TARGET;
  const after = context.slice(Math.min(6, localIdx) + TARGET.length);

  document.getElementById('foundPos').textContent = absolutePos.toLocaleString();
  document.getElementById('foundContext').innerHTML =
    `...${before}<span class="match">${match}</span>${after}...`;
  document.getElementById('foundDesc').innerHTML =
    `π の小数点以下 <strong style="color:var(--found)">${absolutePos.toLocaleString()}</strong> 桁目に光速 (299,792,458 m/s) が出現<br>
    検索時間: ${((Date.now()-startTime)/1000).toFixed(1)}秒 / 検索桁数: ${fmt(totalSearched)}`;
  document.getElementById('resultPanel').classList.add('visible');

  log(`🎯 発見！ 小数点以下${absolutePos.toLocaleString()}桁目！`, 'success');
}

function resetProgress() {
  clearProgress();
  document.getElementById('startPos').value = 200000000;
  log('進捗リセット — 2億桁目からスタート', 'warn');
}

function stopSearch() {
  running = false;
  saveProgress(currentPos);
  releaseWakeLock();
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  log(`検索停止: ${fmt(totalSearched)}桁検索済み — 進捗保存済み`, 'warn');
  document.getElementById('notfoundPanel').classList.add('visible');
  document.getElementById('notfoundDesc').textContent =
    `${fmt(totalSearched)}桁検索済み — 手動停止`;
}
</script>
</body>
</html>
